version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sirius_rabbitmq
    ports:
      - "5672:5672"      # AMQP-протокол
      - "15672:15672"    # Веб-интерфейс (Management UI)
      - "15692:15692"    # Prometheus metrics
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
    command: ["bash", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
  
  prometheus:
    image: prom/prometheus:latest
    container_name: sirius_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - rabbitmq
      - redis-exporter

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: sirius_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
  
  grafana:
    image: grafana/grafana:latest
    container_name: sirius_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sirius_jaeger
    ports:
      - "16686:16686" # Веб-интерфейс Jaeger (сюда будем смотреть)
      - "4318:4318"   # OTLP HTTP (сюда Python будет отправлять трейсы)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  pg_data:
